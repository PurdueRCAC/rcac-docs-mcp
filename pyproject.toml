[project]
name = "rcac-mcp"
version = "0.1.0"
description = "Purdue RCAC MCP Server: Enables agentic development with HPC clusters and storage services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=2.0.0,<3",
    "cmdkit>=2.7.7",
    "pyjwt>=2.0",
]

[project.scripts]
rcac-mcp = "rcac_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcac_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
