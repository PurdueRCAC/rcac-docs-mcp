[project]
name = "rcac-docs-mcp"
version = "0.1.0"
description = "MCP Server for Purdue RCAC documentation: full-text docs search for AI agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=2.0.0,<3",
    "cmdkit>=2.7.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
rcac-docs-mcp = "rcac_docs_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcac_docs_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
